name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fotobuch-linux-x86_64
            binary: fotobuch
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: fotobuch-windows-x86_64
            binary: fotobuch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Build (CLI + GUI)
        run: cargo build --profile dist --features gui --target ${{ matrix.target }}

      - name: Smoke test (CLI)
        shell: bash
        run: ./target/${{ matrix.target }}/dist/${{ matrix.binary }} --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/dist/fotobuch fotobuch
          cp target/${{ matrix.target }}/dist/fotobuch-gui fotobuch-gui
          tar -czf ${{ matrix.artifact }}.tar.gz fotobuch fotobuch-gui
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\dist\fotobuch.exe" "fotobuch.exe"
          Copy-Item "target\${{ matrix.target }}\dist\fotobuch-gui.exe" "fotobuch-gui.exe"
          Compress-Archive -Path fotobuch.exe, fotobuch-gui.exe -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash
          "$hash  ${{ matrix.artifact }}.zip" | Out-File "${{ matrix.artifact }}.zip.sha256" -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  appimage:
    name: Build AppImage (Linux GUI)
    runs-on: ubuntu-22.04 # oldest supported glibc baseline
    env:
      target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libfuse2

      - name: Build (GUI)
        run: cargo build --profile dist --features gui --bin fotobuch-gui --target ${{ env.target }}

      - name: Download linuxdeploy
        run: |
          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # run AppImage tools without relying on FUSE
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable target/${{ env.target }}/dist/fotobuch-gui \
            --desktop-file packaging/fotobuch-gui.desktop \
            --icon-file packaging/fotobuch-gui.png \
            --output appimage
          mv Fotobuch-*-x86_64.AppImage fotobuch-linux-x86_64.AppImage
          sha256sum fotobuch-linux-x86_64.AppImage > fotobuch-linux-x86_64.AppImage.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: fotobuch-linux-x86_64-appimage
          path: fotobuch-linux-x86_64.AppImage*

  release:
    name: Create Release Draft
    needs: [build, appimage]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: git-cliff --config cliff.toml --latest --strip header --output RELEASE_NOTES.md

      - name: Create GitHub Release draft
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            artifacts/**/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
