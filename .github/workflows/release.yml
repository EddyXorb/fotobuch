name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_label: linux-x86_64
            binary: fotobuch
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_label: windows-x86_64
            binary: fotobuch.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Build (CLI + GUI)
        run: cargo build --profile dist --features gui --bin fotobuch --bin fotobuch-gui --target ${{ matrix.target }}

      - name: Smoke test (CLI)
        shell: bash
        run: ./target/${{ matrix.target }}/dist/${{ matrix.binary }} --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          bin_dir="target/${{ matrix.target }}/dist"
          for variant in "cli:fotobuch" "gui:fotobuch-gui"; do
            name="${variant%%:*}"; bin="${variant##*:}"
            archive="fotobuch-${name}-${{ matrix.os_label }}.tar.gz"
            cp "${bin_dir}/${bin}" "${bin}"
            tar -czf "${archive}" "${bin}"
            sha256sum "${archive}" > "${archive}.sha256"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "target\${{ matrix.target }}\dist"
          $variants = @{ cli = "fotobuch.exe"; gui = "fotobuch-gui.exe" }
          foreach ($name in $variants.Keys) {
            $bin = $variants[$name]
            $archive = "fotobuch-$name-${{ matrix.os_label }}.zip"
            Copy-Item "$binDir\$bin" "$bin"
            Compress-Archive -Path "$bin" -DestinationPath "$archive"
            $hash = (Get-FileHash "$archive" -Algorithm SHA256).Hash
            "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fotobuch-${{ matrix.os_label }}
          path: |
            fotobuch-cli-${{ matrix.os_label }}.*
            fotobuch-gui-${{ matrix.os_label }}.*

  release:
    name: Create Release Draft
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        run: git-cliff --config cliff.toml --latest --strip header --output RELEASE_NOTES.md

      - name: Create GitHub Release draft
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            artifacts/**/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
