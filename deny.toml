# cargo-deny configuration. CI runs `cargo deny check licenses` only;
# security advisories are covered by the cargo-audit workflow.

[graph]
# The targets of the release workflow.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = true

[licenses]
# Licenses that allow distributing fotobuch under the AGPL as well as under a
# commercial license. Keep in sync with `accepted` in about.toml.
# Do not add copyleft licenses (GPL, LGPL, AGPL) here: they would rule out
# commercial licensing.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # fotobuch itself.
    { crate = "fotobuch", allow = ["AGPL-3.0-or-later"] },
]
