<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#1e1f22" rx="8"/>

  <!-- Toolbar -->
  <rect x="0" y="0" width="640" height="40" fill="#2b2d30" rx="8 8 0 0"/>
  <rect x="0" y="30" width="640" height="10" fill="#2b2d30"/>
  <line x1="0" y1="40" x2="640" y2="40" stroke="#3d4045" stroke-width="1"/>
  <text x="320" y="25" text-anchor="middle" fill="#9da0a8" font-family="sans-serif" font-size="13" font-weight="600">Toolbar</text>

  <!-- Pool panel -->
  <rect x="0" y="40" width="148" height="222" fill="#2b2d30"/>
  <line x1="148" y1="40" x2="148" y2="262" stroke="#3d4045" stroke-width="1"/>
  <text x="74" y="148" text-anchor="middle" fill="#6f737b" font-family="sans-serif" font-size="12">📷</text>
  <text x="74" y="166" text-anchor="middle" fill="#9da0a8" font-family="sans-serif" font-size="12" font-weight="600">Photo Pool</text>
  <rect x="20" y="60" width="108" height="22" fill="#3d4045" rx="3"/>
  <rect x="20" y="88" width="108" height="22" fill="#3d4045" rx="3"/>
  <rect x="20" y="116" width="108" height="22" fill="#3d4045" rx="3"/>

  <!-- Central panel -->
  <rect x="149" y="40" width="342" height="222" fill="#1e1f22"/>
  <rect x="215" y="58" width="210" height="156" fill="#ffffff" rx="3"/>
  <rect x="225" y="68" width="88" height="64" fill="#d8d8d8" rx="2"/>
  <rect x="323" y="68" width="92" height="64" fill="#d0d0d0" rx="2"/>
  <rect x="225" y="140" width="190" height="64" fill="#e0e0e0" rx="2"/>
  <text x="320" y="232" text-anchor="middle" fill="#9da0a8" font-family="sans-serif" font-size="12" font-weight="600">Central Panel</text>

  <!-- Nav panel -->
  <rect x="492" y="40" width="148" height="222" fill="#2b2d30"/>
  <line x1="491" y1="40" x2="491" y2="262" stroke="#3d4045" stroke-width="1"/>
  <rect x="512" y="58" width="108" height="50" fill="#3d4045" rx="3"/>
  <rect x="512" y="116" width="108" height="50" fill="#3d4045" rx="3"/>
  <rect x="512" y="174" width="108" height="50" fill="#3d4045" rx="3"/>
  <text x="566" y="240" text-anchor="middle" fill="#9da0a8" font-family="sans-serif" font-size="12" font-weight="600">Nav Strip</text>

  <!-- Status bar -->
  <line x1="0" y1="262" x2="640" y2="262" stroke="#3d4045" stroke-width="1"/>
  <rect x="0" y="263" width="640" height="37" fill="#2b2d30" rx="0 0 8 8"/>
  <rect x="0" y="263" width="640" height="12" fill="#2b2d30"/>
  <text x="320" y="285" text-anchor="middle" fill="#9da0a8" font-family="sans-serif" font-size="12" font-weight="600">Status bar</text>

  <!-- Outer border -->
  <rect x="0.5" y="0.5" width="639" height="299" fill="none" stroke="#3d4045" stroke-width="1" rx="8"/>
</svg>
